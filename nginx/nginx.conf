user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept off;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Hierarchical L7 control by client profile (IP + suspicious UA).
    map $http_user_agent $ua_bucket {
        default normal;
        "~*(curl|wget|python|scrapy|sqlmap|nikto|nmap|masscan|zgrab|bot|headless)" suspicious;
        "" suspicious;
    }

    map $ua_bucket $ua_limit_key {
        default "";
        suspicious $binary_remote_addr;
    }

    # Trust Cloudflare edge proxies and restore the real visitor IP.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Use peer address before realip rewrite for origin-lock checks.
    map $realip_remote_addr $origin_peer_addr {
        default $realip_remote_addr;
        ""      $remote_addr;
    }

    geo $origin_peer_addr $is_allowed_origin {
        default 0;
        127.0.0.1/32 1;
        ::1/128 1;
        10.0.0.0/8 1;
        172.16.0.0/12 1;
        192.168.0.0/16 1;
        173.245.48.0/20 1;
        103.21.244.0/22 1;
        103.22.200.0/22 1;
        103.31.4.0/22 1;
        141.101.64.0/18 1;
        108.162.192.0/18 1;
        190.93.240.0/20 1;
        188.114.96.0/20 1;
        197.234.240.0/22 1;
        198.41.128.0/17 1;
        162.158.0.0/15 1;
        104.16.0.0/13 1;
        104.24.0.0/14 1;
        172.64.0.0/13 1;
        131.0.72.0/22 1;
        2400:cb00::/32 1;
        2606:4700::/32 1;
        2803:f800::/32 1;
        2405:b500::/32 1;
        2405:8100::/32 1;
        2a06:98c0::/29 1;
        2c0f:f248::/32 1;
    }

    # Keep origin lockdown disabled until Cloudflare proxy is fully active.
    # default 1 = lock all hostnames/IP direct hits unless request comes from allowed origin peers.
    # To temporarily disable lockdown during maintenance, set default to 0.
    map $host $origin_lockdown {
        default 1;
        zackpro.codes 1;
    }

    map "$origin_lockdown:$is_allowed_origin" $block_direct_origin {
        default 0;
        "1:0" 1;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 10s;
    keepalive_requests 100;
    reset_timedout_connection on;
    client_body_timeout 5s;
    client_header_timeout 5s;
    send_timeout 5s;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 8k;
    types_hash_max_size 2048;
    client_max_body_size 2M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    # Rate limiting (hierarchical zones)
    limit_req_zone $binary_remote_addr zone=login_limit:20m rate=4r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=12r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:20m rate=25r/s;
    limit_req_zone $ua_limit_key      zone=suspicious_limit:20m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        listen [::]:80;
        server_name zackpro.codes 46.101.209.56;

        error_page 429 = /_errors/429.txt;
        error_page 503 504 = /_errors/503.txt;

        location = /_errors/429.txt {
            internal;
            default_type text/plain;
            return 429 "Too Many Requests\n";
        }

        location = /_errors/503.txt {
            internal;
            default_type text/plain;
            return 503 "Service Unavailable\n";
        }

        if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
            return 405;
        }

        if ($block_direct_origin = 1) {
            return 403;
        }

        # ACME challenge endpoint for Let's Encrypt renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check (local container only)
        location = /healthz {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name zackpro.codes 46.101.209.56;

        error_page 429 = /_errors/429.txt;
        error_page 503 504 = /_errors/503.txt;

        location = /_errors/429.txt {
            internal;
            default_type text/plain;
            return 429 "Too Many Requests\n";
        }

        location = /_errors/503.txt {
            internal;
            default_type text/plain;
            return 503 "Service Unavailable\n";
        }

        if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
            return 405;
        }

        if ($block_direct_origin = 1) {
            return 403;
        }

        # SSL certificates (from Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/zackpro.codes/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/zackpro.codes/privkey.pem;

        # SSL security
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS header
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Auth/login paths get the strictest controls.
        location ^~ /api/auth/ {
            limit_req zone=login_limit burst=8 nodelay;
            limit_req zone=suspicious_limit burst=3 nodelay;
            limit_conn conn_limit_per_ip 12;
            proxy_pass http://app:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 3s;
            proxy_send_timeout 12s;
            proxy_read_timeout 12s;
        }

        # General API controls.
        location ^~ /api/ {
            limit_req zone=api_limit burst=24 nodelay;
            limit_req zone=suspicious_limit burst=5 nodelay;
            limit_conn conn_limit_per_ip 24;
            proxy_pass http://app:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }

        # Static files
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            limit_req zone=general_limit burst=40 nodelay;
            limit_req zone=suspicious_limit burst=6 nodelay;
            limit_conn conn_limit_per_ip 36;
            proxy_pass http://app:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_valid 200 1d;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        # Default location
        location / {
            limit_req zone=general_limit burst=30 nodelay;
            limit_req zone=suspicious_limit burst=6 nodelay;
            limit_conn conn_limit_per_ip 28;
            proxy_pass http://app:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 15s;
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
        }

        # Health check (local container only)
        location = /healthz {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
