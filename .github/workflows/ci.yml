# ============================================
#   CI/CD Pipeline — منصة الاختبارات التفاعلية
# ============================================
name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Enforce compose port policy
        run: npm run check:compose-security

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Check for security vulnerabilities
        working-directory: ./server
        run: npm audit --audit-level=high

      - name: Verify server starts
        working-directory: ./server
        run: |
          export JWT_SECRET="ci-jwt-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          export ENCRYPTION_KEY="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')"
          node -e "try { require('./index.js'); console.log('✅ Server module loads OK'); } catch(e) { if (!e.message.includes('ECONNREFUSED') && !e.message.includes('connect')) { throw e; } console.log('✅ Module structure OK (DB not available in CI)'); }"
        env:
          DB_HOST: localhost
          DB_NAME: test
          DB_USER: test
          DB_PASS: test
          DB_PASSWORD: test
          GOOGLE_CLIENT_ID: test
          NODE_ENV: test

      - name: Run unit tests
        working-directory: ./server
        run: |
          export JWT_SECRET="ci-jwt-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          export ENCRYPTION_KEY="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')"
          npm test
        env:
          DB_HOST: localhost
          DB_NAME: test
          DB_USER: test
          DB_PASS: test
          DB_PASSWORD: test
          GOOGLE_CLIENT_ID: test
          ADMIN_EMAILS: admin@test.com
          NODE_ENV: test

      - name: Run frontend security coverage gate
        if: matrix.node-version == 20
        run: npm run test:client:secure

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t quiz-platform:${{ github.sha }} .

      - name: Verify Docker image
        run: docker images quiz-platform:${{ github.sha }}
