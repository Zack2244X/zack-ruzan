name: CI/CD — Build & Deploy to Droplet

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight required deploy secrets
        id: preflight
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST != '' && secrets.DROPLET_HOST || '165.22.80.240' }}
          DROPLET_USER: ${{ secrets.DROPLET_USER != '' && secrets.DROPLET_USER || 'root' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_APP_DIR: ${{ secrets.REMOTE_APP_DIR != '' && secrets.REMOTE_APP_DIR || '/srv/yourapp' }}
        run: |
          set -e
          missing=""
          for var_name in DROPLET_HOST DROPLET_USER SSH_PRIVATE_KEY REMOTE_APP_DIR; do
            eval "value=\${$var_name}"
            if [ -z "$value" ]; then
              missing="$missing $var_name"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::warning::Missing required deployment secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "All required deployment secrets are configured."

      - name: Use Node.js
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 18

      - name: Install deps & build frontend
        if: steps.preflight.outputs.ready == 'true'
        run: |
          npm ci
          npm run build:css

      - name: Enforce compose port policy
        if: steps.preflight.outputs.ready == 'true'
        run: npm run check:compose-security

      - name: Run server tests
        if: steps.preflight.outputs.ready == 'true'
        run: |
          npm --prefix server ci
          npm --prefix server test

      - name: Audit production dependencies (server)
        if: steps.preflight.outputs.ready == 'true'
        run: npm --prefix server audit --omit=dev --audit-level=high

      - name: Deploy to Droplet via SSH
        if: steps.preflight.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST != '' && secrets.DROPLET_HOST || '165.22.80.240' }}
          username: ${{ secrets.DROPLET_USER != '' && secrets.DROPLET_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            APP_DIR="${{ secrets.REMOTE_APP_DIR != '' && secrets.REMOTE_APP_DIR || '/srv/yourapp' }}"
            if [ ! -d "$APP_DIR" ]; then
              echo "Remote app dir not found: $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"
            git fetch --all --prune
            git checkout main
            git reset --hard origin/main
            docker-compose pull || true
            docker-compose up -d --build --remove-orphans
            docker image prune -f

      - name: Verify no public port 3000 on host
        if: steps.preflight.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST != '' && secrets.DROPLET_HOST || '165.22.80.240' }}
          username: ${{ secrets.DROPLET_USER != '' && secrets.DROPLET_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            if ss -tuln | grep -E '(0\.0\.0\.0:3000|\[::\]:3000)' >/dev/null; then
              echo "Public port 3000 detected on host. Blocking deployment success."
              ss -tuln | grep -E '(0\.0\.0\.0:3000|\[::\]:3000)' || true
              exit 1
            fi
            echo "No public port 3000 detected."

      - name: Post-deploy health check
        if: steps.preflight.outputs.ready == 'true'
        env:
          HEALTHCHECK_URL: ${{ secrets.APP_HEALTHCHECK_URL != '' && secrets.APP_HEALTHCHECK_URL || 'https://zackpro.codes/healthz' }}
        run: |
          set -e
          echo "Checking $HEALTHCHECK_URL"
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$HEALTHCHECK_URL" || true)
            if [ "$code" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i failed with status $code"
            sleep 8
          done
          echo "Health check failed after deploy"
          exit 1
