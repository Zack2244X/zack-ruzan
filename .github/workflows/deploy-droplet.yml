name: CI/CD — Build & Deploy to Droplet

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 18

      - name: Install deps & build frontend
        run: |
          npm ci
          npm run build:css

      - name: Run server tests
        run: |
          npm --prefix server ci
          npm --prefix server test

      - name: Audit production dependencies (server)
        run: npm --prefix server audit --omit=dev --audit-level=high

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ secrets.IMAGE_NAME }}

      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd ${{ secrets.REMOTE_APP_DIR }}
            docker-compose pull
            docker-compose up -d --remove-orphans
            docker image prune -f

      - name: Post-deploy health check
        env:
          HEALTHCHECK_URL: ${{ secrets.APP_HEALTHCHECK_URL != '' && secrets.APP_HEALTHCHECK_URL || 'https://zackpro.codes/healthz' }}
        run: |
          set -e
          echo "Checking $HEALTHCHECK_URL"
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$HEALTHCHECK_URL" || true)
            if [ "$code" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i failed with status $code"
            sleep 8
          done
          echo "Health check failed after deploy"
          exit 1
