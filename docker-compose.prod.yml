services:
  app:
    image: ${IMAGE_NAME}
    restart: always
    environment:
      NODE_ENV: production
      PORT: ${PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
    depends_on:
      - db
    volumes:
      - ./server/uploads:/app/uploads
    networks:
      - web
    healthcheck:
      # Use Node (available in the runtime image) to perform the HTTP health check
      test: ["CMD-SHELL", "node -e \"const http=require('http'); const req=http.get('http://localhost:${PORT}/api/health', res=>{process.exit(res.statusCode===200?0:1)}); req.on('error', ()=>process.exit(1));\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2.7
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      # Uncomment to expose HTTPS when you set up a real domain and TLS
      # - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - PORT=${PORT}
    networks:
      - web

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - web
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']

volumes:
  db_data:
  caddy_data:
  caddy_config:
  backups:

networks:
  web:
    driver: bridge

