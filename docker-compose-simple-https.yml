version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: quiz-platform:latest
    restart: always
    environ:
      NODE_ENV: production
      PORT: 10000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: qp_user
      DB_PASSWORD: YourStrongDBPassword123!@#
      DB_NAME: quiz_platform
      JWT_SECRET: your_very_long_jwt_secret_key_min_32_chars_change_me_now_123456
      ENCRYPTION_KEY: d8531dcd3f9ec4d47604e15efbcafb0c609adde058756acefa4e46ed1498593f
      ALLOWED_ORIGINS: https://zackpro.codes,http://46.101.209.56
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web
    expose:
      - "10000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: YourStrongRootPassword456!@#
      MYSQL_DATABASE: quiz_platform
      MYSQL_USER: qp_user
      MYSQL_PASSWORD: YourStrongDBPassword123!@#
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - web
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx-simple.conf:/etc/nginx/nginx.conf:ro
    networks:
      - web
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:

networks:
  web:
    driver: bridge
